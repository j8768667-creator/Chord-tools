<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cMIDI Studio Utilities Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi@2.0.28/build/Midi.js"></script>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b22;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --secondary-btn: #374151;
            --secondary-btn-hover: #4b5563;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #2e3440;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0 0 0.5rem 0;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1050px;
        }

        @media (min-width: 820px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            margin: 0;
            font-size: 1.25rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.02);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-color);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .drop-zone p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .drop-zone span {
            color: var(--accent-color);
            font-weight: bold;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .control-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        select, input[type="range"] {
            width: 100%;
            padding: 0.45rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.7rem 1rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
            flex: 2;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn-preview {
            background-color: var(--secondary-btn);
            flex: 1;
        }

        .btn-preview:hover:not(:disabled) {
            background-color: var(--secondary-btn-hover);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.8rem;
            color: var(--accent-color);
            min-height: 1.1em;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <header>
        <h1>cMIDI Studio Utilities Pro</h1>
        <p>Harmonic Extraction, Key Shift, Groove Injection & Web Preview</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>1. Chord Progression "Borrower"</h2>
            <div class="drop-zone" id="borrower-drop">
                <p>Drag & Drop complex MIDI file here or <span>browse</span></p>
                <input type="file" id="borrower-input" accept=".mid,.midi" style="display: none;">
            </div>
            <div class="status" id="borrower-status">No file loaded</div>

            <div class="controls">
                <div class="control-row">
                    <div class="control-group">
                        <label for="block-length">Block Length</label>
                        <select id="block-length">
                            <option value="4">4-Bar Block</option>
                            <option value="8" selected>8-Bar Block</option>
                            <option value="16">16-Bar Block</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="polyphony-threshold">Min Polyphony</label>
                        <select id="polyphony-threshold">
                            <option value="2">2+ Notes (Dyads)</option>
                            <option value="3" selected>3+ Notes (Triads/Chords)</option>
                            <option value="4">4+ Notes (Extended Chords)</option>
                        </select>
                    </div>
                </div>

                <div class="control-row">
                    <div class="control-group">
                        <label for="transpose-semitones">Transpose (Semitones)</label>
                        <select id="transpose-semitones">
                            <option value="-6">-6 Semitones</option>
                            <option value="-5">-5 Semitones</option>
                            <option value="-4">-4 Semitones</option>
                            <option value="-3">-3 Semitones</option>
                            <option value="-2">-2 Semitones</option>
                            <option value="-1">-1 Semitone</option>
                            <option value="0" selected>0 (Original Key)</option>
                            <option value="1">+1 Semitone</option>
                            <option value="2">+2 Semitones</option>
                            <option value="3">+3 Semitones</option>
                            <option value="4">+4 Semitones</option>
                            <option value="5">+5 Semitones</option>
                            <option value="6">+6 Semitones</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="quantize-grid">Chord Snap Grid</label>
                        <select id="quantize-grid">
                            <option value="4">1/4 Note Grid</option>
                            <option value="2" selected>1/2 Note Grid</option>
                            <option value="1">1 Bar Grid</option>
                        </select>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-preview" id="borrower-preview-btn" disabled>▶ Preview</button>
                    <button class="btn" id="borrower-btn" disabled>Extract & Download</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>2. Groove Humanizer / "De-Quantizer"</h2>
            <div class="drop-zone" id="humanizer-drop">
                <p>Drag & Drop quantized MIDI file here or <span>browse</span></p>
                <input type="file" id="humanizer-input" accept=".mid,.midi" style="display: none;">
            </div>
            <div class="status" id="humanizer-status">No file loaded</div>

            <div class="controls">
                <div class="control-group">
                    <label for="groove-preset">Groove Preset</label>
                    <select id="groove-preset">
                        <option value="mpc">90s MPC Drum Sway (16th Swing)</option>
                        <option value="dilla">Lazy Neo-Soul Dilla-Puck (Behind the beat)</option>
                        <option value="drift">Human Drummer Drift (Natural velocity float)</option>
                        <option value="lofi">Lo-Fi Chillhop Push (Micro-early snares & velocity)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="timing-amount">Timing Shift (ms): <span id="timing-val">15</span>ms</label>
                    <input type="range" id="timing-amount" min="0" max="60" value="15">
                </div>

                <div class="control-group">
                    <label for="velocity-amount">Velocity Variation: <span id="vel-val">15</span></label>
                    <input type="range" id="velocity-amount" min="0" max="50" value="15">
                </div>

                <div class="control-group">
                    <label for="timing-bias">Timing Bias</label>
                    <select id="timing-bias">
                        <option value="centered" selected>Centered (Random Lead/Lag)</option>
                        <option value="behind">Behind Beat (Laid Back / Dragging)</option>
                        <option value="ahead">Ahead Beat (Rushed / Driving)</option>
                    </select>
                </div>

                <div class="btn-group">
                    <button class="btn btn-preview" id="humanizer-preview-btn" disabled>▶ Preview</button>
                    <button class="btn" id="humanizer-btn" disabled>Apply Groove & Download</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Shared Audio Preview Synth ---
        let synth = null;
        let isPlaying = false;

        function getSynth() {
            if (!synth) {
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.02, decay: 0.1, sustain: 0.3, release: 0.8 }
                }).toDestination();
                synth.volume.value = -8;
            }
            return synth;
        }

        function stopPlayback() {
            Tone.Transport.stop();
            Tone.Transport.cancel();
            isPlaying = false;
            document.getElementById('borrower-preview-btn').innerText = "▶ Preview";
            document.getElementById('humanizer-preview-btn').innerText = "▶ Preview";
        }

        async function previewMidi(midiInstance, btnElement) {
            if (isPlaying) {
                stopPlayback();
                return;
            }

            await Tone.start();
            stopPlayback();

            const polySynth = getSynth();
            const bpm = midiInstance.header.bpm || 120;
            Tone.Transport.bpm.value = bpm;

            midiInstance.tracks.forEach(track => {
                track.notes.forEach(note => {
                    Tone.Transport.schedule((time) => {
                        polySynth.triggerAttackRelease(
                            Tone.Frequency(note.midi, "midi").toNote(),
                            note.duration,
                            time,
                            note.velocity
                        );
                    }, note.time);
                });
            });

            btnElement.innerText = "■ Stop";
            isPlaying = true;

            Tone.Transport.start();
            
            // Auto stop when finished
            const maxDuration = Math.max(...midiInstance.tracks.flatMap(t => t.notes.map(n => n.time + n.duration)));
            Tone.Transport.schedule(() => {
                stopPlayback();
            }, maxDuration + 0.5);
        }

        // --- Helper: Setup Drag and Drop File Handlers ---
        function setupDropZone(dropZoneId, inputId, callback) {
            const dropZone = document.getElementById(dropZoneId);
            const input = document.getElementById(inputId);

            dropZone.addEventListener('click', () => input.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            ['dragleave', 'drop'].forEach(event => {
                dropZone.addEventListener(event, () => dropZone.classList.remove('dragover'));
            });

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer.files.length) {
                    input.files = e.dataTransfer.files;
                    callback(e.dataTransfer.files[0]);
                }
            });

            input.addEventListener('change', (e) => {
                if (e.target.files.length) {
                    callback(e.target.files[0]);
                }
            });
        }

        // --- Helper: Download Blob as File ---
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // =========================================================
        // TOOL 1: CHORD PROGRESSION BORROWER LOGIC
        // =========================================================
        let borrowerMidiData = null;

        setupDropZone('borrower-drop', 'borrower-input', async (file) => {
            const arrayBuffer = await file.arrayBuffer();
            borrowerMidiData = new Midi(arrayBuffer);
            document.getElementById('borrower-status').innerText = `Loaded: ${file.name}`;
            document.getElementById('borrower-btn').disabled = false;
            document.getElementById('borrower-preview-btn').disabled = false;
        });

        function processBorrowerMidi() {
            if (!borrowerMidiData) return null;

            const minPolyphony = parseInt(document.getElementById('polyphony-threshold').value);
            const blockBars = parseInt(document.getElementById('block-length').value);
            const transpose = parseInt(document.getElementById('transpose-semitones').value);
            const quantizeDivisions = parseInt(document.getElementById('quantize-grid').value);

            const outputMidi = new Midi();
            outputMidi.header.bpm = borrowerMidiData.header.bpm || 120;
            const outputTrack = outputMidi.addTrack();

            let allNotes = [];
            borrowerMidiData.tracks.forEach(track => {
                allNotes = allNotes.concat(track.notes);
            });

            const bpm = outputMidi.header.bpm;
            const quarterNoteSec = 60 / bpm;
            const snapIntervalSec = (quarterNoteSec * 4) / (quantizeDivisions * 4); 

            const timeBuckets = {};

            allNotes.forEach(note => {
                const bucketTime = Math.round(note.time / snapIntervalSec) * snapIntervalSec;
                if (!timeBuckets[bucketTime]) timeBuckets[bucketTime] = [];
                timeBuckets[bucketTime].push(note);
            });

            const barDurationSec = quarterNoteSec * 4;
            const maxDurationSec = blockBars * barDurationSec;

            Object.keys(timeBuckets).forEach(timeStr => {
                const time = parseFloat(timeStr);
                if (time >= maxDurationSec) return;

                const notesAtTime = timeBuckets[timeStr];
                if (notesAtTime.length >= minPolyphony) {
                    const avgDuration = notesAtTime.reduce((acc, n) => acc + n.duration, 0) / notesAtTime.length;
                    
                    notesAtTime.forEach(note => {
                        outputTrack.addNote({
                            midi: Math.min(127, Math.max(0, note.midi + transpose)),
                            time: time,
                            duration: Math.max(avgDuration, snapIntervalSec),
                            velocity: 0.85
                        });
                    });
                }
            });

            return outputMidi;
        }

        document.getElementById('borrower-preview-btn').addEventListener('click', () => {
            const processed = processBorrowerMidi();
            if (processed) previewMidi(processed, document.getElementById('borrower-preview-btn'));
        });

        document.getElementById('borrower-btn').addEventListener('click', () => {
            const processed = processBorrowerMidi();
            if (!processed) return;
            const blockBars = document.getElementById('block-length').value;
            const outArray = processed.toArray();
            const blob = new Blob([outArray], { type: 'audio/midi' });
            downloadBlob(blob, `borrowed_progression_${blockBars}bars.mid`);
        });

        // =========================================================
        // TOOL 2: VELOCITY & TIMING HUMANIZER LOGIC
        // =========================================================
        let humanizerMidiData = null;

        document.getElementById('timing-amount').addEventListener('input', (e) => {
            document.getElementById('timing-val').innerText = e.target.value;
        });
        document.getElementById('velocity-amount').addEventListener('input', (e) => {
            document.getElementById('vel-val').innerText = e.target.value;
        });

        setupDropZone('humanizer-drop', 'humanizer-input', async (file) => {
            const arrayBuffer = await file.arrayBuffer();
            humanizerMidiData = new Midi(arrayBuffer);
            document.getElementById('humanizer-status').innerText = `Loaded: ${file.name}`;
            document.getElementById('humanizer-btn').disabled = false;
            document.getElementById('humanizer-preview-btn').disabled = false;
        });

        function processHumanizedMidi() {
            if (!humanizerMidiData) return null;

            const preset = document.getElementById('groove-preset').value;
            const bias = document.getElementById('timing-bias').value;
            const maxTimingOffsetSec = parseFloat(document.getElementById('timing-amount').value) / 1000;
            const maxVelOffset = parseInt(document.getElementById('velocity-amount').value) / 127;

            const processedMidi = new Midi(humanizerMidiData.toArray());

            processedMidi.tracks.forEach(track => {
                track.notes.forEach(note => {
                    const randG = () => ((Math.random() + Math.random() + Math.random()) - 1.5) / 1.5;

                    let timingShift = randG() * maxTimingOffsetSec;
                    let velShift = randG() * maxVelOffset;

                    // Apply Timing Bias
                    if (bias === 'behind') timingShift = Math.abs(timingShift);
                    if (bias === 'ahead') timingShift = -Math.abs(timingShift);

                    // Apply Groove Presets
                    const quarterSec = 60 / (processedMidi.header.bpm || 120);
                    const sixteenthSec = quarterSec / 4;
                    const sixteenthIndex = Math.round(note.time / sixteenthSec);

                    if (preset === 'mpc') {
                        if (sixteenthIndex % 2 !== 0) timingShift += 0.015; // 16th swing push
                    } else if (preset === 'dilla') {
                        timingShift += (Math.random() * 0.022); // Lay back
                        velShift -= 0.08;
                    } else if (preset === 'lofi') {
                        if (sixteenthIndex % 4 === 2) timingShift -= 0.008; // Slight snare push
                        velShift += (Math.random() - 0.5) * 0.12;
                    }

                    note.time = Math.max(0, note.time + timingShift);
                    note.velocity = Math.min(1.0, Math.max(0.1, note.velocity + velShift));
                });
            });

            return processedMidi;
        }

        document.getElementById('humanizer-preview-btn').addEventListener('click', () => {
            const processed = processHumanizedMidi();
            if (processed) previewMidi(processed, document.getElementById('humanizer-preview-btn'));
        });

        document.getElementById('humanizer-btn').addEventListener('click', () => {
            const processed = processHumanizedMidi();
            if (!processed) return;
            const preset = document.getElementById('groove-preset').value;
            const outArray = processed.toArray();
            const blob = new Blob([outArray], { type: 'audio/midi' });
            downloadBlob(blob, `humanized_${preset}.mid`);
        });
    </script>
</body>
</html>
