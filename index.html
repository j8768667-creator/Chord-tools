<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MIDI Stitcher">
    <title>Smart Multi-Track MIDI Stitcher</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; touch-action: manipulation; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; background-color: #f5f5f7; color: #1d1d1f; user-select: none; -webkit-user-select: none; }
        #app-container { max-width: 700px; margin: 0 auto; height: 100%; overflow-y: auto; padding-bottom: 80px; }
        h1 { font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 20px; }
        h2 { font-size: 18px; font-weight: 600; margin-top: 20px; color: #424245; }
        .touch-target { min-height: 50px; padding: 12px 24px; font-size: 16px; border-radius: 14px; border: 1px solid #d2d2d7; background-color: #ffffff; width: 100%; margin-bottom: 12px; }
        #upload-zone { border: 2px dashed #0071e3; border-radius: 16px; padding: 30px 20px; text-align: center; background-color: rgba(0, 113, 227, 0.04); margin-bottom: 12px; }
        #timeline-workspace { background: #ffffff; border-radius: 16px; padding: 16px; border: 1px solid #e5e5ea; min-height: 120px; }
        .midi-track-block { background: #e3f2fd; border: 2px solid #0071e3; padding: 16px; border-radius: 12px; margin-bottom: 10px; font-weight: 600; cursor: grab; touch-action: none; display: flex; justify-content: space-between; align-items: center; }
        .drag-handle { font-size: 20px; color: #0071e3; padding-left: 10px; }
        .btn-primary { background: #0071e3; color: #ffffff; border: none; font-weight: 600; cursor: pointer; }
        .btn-primary:disabled { background: #aeaeaf; cursor: not-allowed; }
        .btn-danger { background: #ff3b30; color: #ffffff; border: none; font-weight: 600; cursor: pointer; }
        .info-card { background: #f5f5f7; padding: 12px; border-radius: 10px; font-size: 13px; color: #6e6e73; border: 1px solid #e5e5ea; margin-top: 4px; }
        .slider-container { background: #ffffff; border: 1px solid #d2d2d7; border-radius: 14px; padding: 14px 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .slider-container label { font-weight: 600; font-size: 16px; }
        .slider-container input[type="range"] { width: 60%; height: 8px; -webkit-appearance: none; background: #e5e5ea; border-radius: 4px; outline: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #0071e3; cursor: pointer; }
        .bpm-display { font-weight: 700; font-size: 16px; color: #0071e3; min-width: 60px; text-align: right; }
    </style>
</head>
<body>
    <main id="app-container">
        <h1>Smart Multi-Track Stitcher</h1>
        <section>
            <h2>1. Choose Motifs</h2>
            <div id="upload-zone">
                <input type="file" id="midi-uploader" class="touch-target" multiple accept=".mid,.midi,audio/midi,audio/x-midi,application/x-midi">
            </div>
            <button id="btn-reset" class="touch-target btn-danger">🗑️ Reset Workspace</button>
        </section>
        <section>
            <h2>2. Visual Drag Arrangement</h2>
            <div id="timeline-workspace">
                <p style="color: #86868b; text-align: center; margin-top: 30px;">Uploaded clips appear here</p>
            </div>
        </section>
        <section>
            <h2>3. Settings</h2>
            <select id="genre-select" class="touch-target">
                <option value="lofi">Lo-Fi Hip Hop (Laid Back Groove)</option>
                <option value="electronic">Synthwave (Driving Grid)</option>
                <option value="ambient">Ambient (Minimal Pulse)</option>
            </select>
            <div class="slider-container">
                <label for="bpm-slider">Tempo:</label>
                <input type="range" id="bpm-slider" min="60" max="180" value="120">
                <span id="bpm-val" class="bpm-display">120 BPM</span>
            </div>
        </section>
        <section style="margin-top: 24px;">
            <button id="btn-stitch" class="touch-target btn-primary">⚡ Merge & Auto-Generate Parts</button>
            <div class="info-card">Outputs 3 distinct humanised timeline tracks: Melody, Bass, and Channel 10 Standard GM Drums.</div>
            <button id="btn-download" class="touch-target" style="border-color: #0071e3; color: #0071e3; font-weight: 600; margin-top:12px;" disabled>📥 Download Multi-Track MIDI</button>
        </section>
    </main>
        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const uploader = document.getElementById('midi-uploader');
            const workspace = document.getElementById('timeline-workspace');
            const btnStitch = document.getElementById('btn-stitch');
            const btnDownload = document.getElementById('btn-download');
            const btnReset = document.getElementById('btn-reset');
            const bpmSlider = document.getElementById('bpm-slider');
            const bpmVal = document.getElementById('bpm-val');
            let uploadedFilesData = []; let draggedElement = null; let mergedMidiBlobUrl = null;

            bpmSlider.addEventListener('input', (e) => { bpmVal.innerText = e.target.value + " BPM"; });

            uploader.addEventListener('change', async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) { return; }
                if (workspace.querySelector('p')) { workspace.innerHTML = ''; }
                for (const file of files) {
                    const buffer = await file.arrayBuffer();
                    try {
                        const parsedMidi = new Midi(buffer);
                        const fileId = 'midi_' + Math.random().toString(36).substr(2, 9);
                        uploadedFilesData.push({ id: fileId, name: file.name, midi: parsedMidi });
                        renderTrackBlock(fileId, file.name);
                    } catch (err) { alert(`Error parsing ${file.name}. Ensure it is a standard MIDI file.`); }
                }
            });

            function renderTrackBlock(id, name) {
                const card = document.createElement('div');
                card.className = 'midi-track-block';
                card.dataset.id = id;
                card.innerHTML = `<span>${name.replace(/\.[^/.]+$/, "")}</span><span class="drag-handle">☰</span>`;
                card.addEventListener('pointerdown', (evt) => { draggedElement = card; card.style.opacity = '0.6'; card.setPointerCapture(evt.pointerId); });
                card.addEventListener('pointerup', (evt) => { if (draggedElement) { card.releasePointerCapture(evt.pointerId); card.style.opacity = '1'; draggedElement = null; } });
                workspace.appendChild(card);
            }

            workspace.addEventListener('pointermove', (evt) => {
                if (!draggedElement) { return; }
                evt.preventDefault();
                const targets = Array.from(workspace.querySelectorAll('.midi-track-block')).filter(el => el !== draggedElement);
                const nextTarget = targets.find(target => { const box = target.getBoundingClientRect(); return evt.clientY < box.top + box.height / 2; });
                workspace.insertBefore(draggedElement, nextTarget);
            });

            btnReset.addEventListener('click', () => {
                uploadedFilesData = [];
                workspace.innerHTML = '<p style="color: #86868b; text-align: center; margin-top: 30px;">Uploaded clips appear here</p>';
                uploader.value = ''; btnDownload.disabled = true;
                if (mergedMidiBlobUrl) { URL.revokeObjectURL(mergedMidiBlobUrl); mergedMidiBlobUrl = null; }
            });

            btnStitch.addEventListener('click', () => {
                const blockOrder = Array.from(workspace.querySelectorAll('.midi-track-block')).map(el => el.dataset.id);
                if (blockOrder.length === 0) { alert("Please upload and arrange files first."); return; }
                const outputMidi = new Midi(); outputMidi.name = "Stitched Production";
                const chosenBpm = parseInt(bpmSlider.value); outputMidi.header.setTempo(chosenBpm);
                const melodyTrack = outputMidi.addTrack(); melodyTrack.name = "Melody Track";
                const bassTrack = outputMidi.addTrack(); bassTrack.name = "Auto Bassline";
                const drumTrack = outputMidi.addTrack(); drumTrack.name = "Standard Drums"; drumTrack.channel = 9;
                let timelineCursor = 0.0; const selectedStyle = document.getElementById('genre-select').value;

                blockOrder.forEach((id) => {
                    const match = uploadedFilesData.find(item => item.id === id); if (!match) { return; }
                    const currentMidi = match.midi; let maxDuration = 0;
                    let humanShift = () => (Math.random() * 0.016) - 0.006;
                    let velocityVariance = () => Math.floor((Math.random() * 12) - 6);

                    currentMidi.tracks.forEach(track => {
                        track.notes.forEach(note => {
                            const noteStartTime = timelineCursor + note.time + humanShift();
                            const noteDuration = note.duration; const noteEndTime = noteStartTime + noteDuration;
                            if (noteEndTime > maxDuration) { maxDuration = noteEndTime; }
                            melodyTrack.addNote({ midi: note.midi, time: Math.max(0, noteStartTime), duration: noteDuration, velocity: Math.min(1, Math.max(0.2, note.velocity + (velocityVariance() / 127))) });
                            if (note.time % 2 === 0) { bassTrack.addNote({ midi: (note.midi % 12) + 36, time: timelineCursor + note.time + humanShift(), duration: 0.8, velocity: 0.75 + (velocityVariance() / 127) }); }
                        });
                    });

                    let drumStepTime = timelineCursor;
                    while (drumStepTime < (timelineCursor + (maxDuration - timelineCursor))) {
                        if (selectedStyle === 'lofi') {
                            drumTrack.addNote({ midi: 36, time: drumStepTime, duration: 0.1, velocity: 0.85 });
                            drumTrack.addNote({ midi: 42, time: drumStepTime + 0.25 + humanShift(), duration: 0.05, velocity: 0.5 });
                            drumTrack.addNote({ midi: 38, time: drumStepTime + 0.5 + humanShift(), duration: 0.1, velocity: 0.8 });
                            drumTrack.addNote({ midi: 42, time: drumStepTime + 0.75, duration: 0.05, velocity: 0.55 });
                            drumStepTime += 1.0;
                        } else {
                            drumTrack.addNote({ midi: 36, time: drumStepTime, duration: 0.1, velocity: 0.9 });
                            drumTrack.addNote({ midi: 42, time: drumStepTime + 0.25, duration: 0.05, velocity: 0.6 });
                            drumTrack.addNote({ midi: 38, time: drumStepTime + 0.5, duration: 0.1, velocity: 0.85 });
                            drumTrack.addNote({ midi: 42, time: drumStepTime + 0.75, duration: 0.05, velocity: 0.6 });
                            drumStepTime += 1.0;
                        }
                    }
                    timelineCursor = Math.ceil(maxDuration);
                });

                const finalMidiBytes = outputMidi.toArray(); const blob = new Blob([finalMidiBytes], { type: "audio/midi" });
                if (mergedMidiBlobUrl) { URL.revokeObjectURL(mergedMidiBlobUrl); }
                mergedMidiBlobUrl = URL.createObjectURL(blob); btnDownload.disabled = false;
                alert("Multi-track alignment completed successfully with humanised timing profiles applied.");
            });

            btnDownload.addEventListener('click', () => {
                if (!mergedMidiBlobUrl) { return; }
                const link = document.createElement('a'); link.href = mergedMidiBlobUrl; link.download = "stitched_multitrack_arrangement.mid";
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            });
        });
    </script>
</body>
</html>
